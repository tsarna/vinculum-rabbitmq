# The broker the integration tests run against.
#
# `services:` containers in a GitHub workflow start before checkout and cannot
# mount a file from the repository, and RabbitMQ needs its definitions file for
# the vhost and user. So the broker is started with compose after checkout
# instead, by the reusable broker-integration workflow in tsarna/vinculum:
#
#   docker compose -f ci/brokers.yml up -d --wait rabbitmq
#   set -a; . ci/rabbitmq.env; set +a
#   go test -race -tags integration ./client/...
#   docker compose -f ci/brokers.yml down -v
#
# That is the same command CI runs, so a failure there reproduces locally.
#
# Ports are published on the loopback interface only, so the broker and its
# known credentials are not reachable from the network — and only one broker on
# these ports can run at a time per machine.

# Named, because compose otherwise takes the project name from this file's
# directory, and every repository that follows this layout calls it ci/. Two
# projects with one name are one project: `up` in one repository replaces the
# other's broker with its own, and `down` in one takes the other's broker with it
# or fails on the network they share.
name: vinculum-rabbitmq-ci

services:
  rabbitmq:
    # -management, because the tests close the client's connection through the
    # management API to make the broker send a real 320 CONNECTION_FORCED.
    image: rabbitmq:4-management
    # Fixed, because the node name is rabbit@$HOSTNAME and a random one makes
    # the log harder to read across runs.
    hostname: vinculum-rabbitmq
    ports:
      - "127.0.0.1:5672:5672" # amqp
      - "127.0.0.1:15672:15672" # management API
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    # The check ends by looking for the vhost from the definitions file, so that
    # `--wait` means "provisioned" rather than "a port answers". The management
    # API listens before that file is imported — only the AMQP listener waits
    # for it — so a management call that arrived on a port answering alone could
    # find no vhost and no user.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_connectivity && rabbitmqctl -q list_vhosts | grep -qx vinculum",
        ]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
