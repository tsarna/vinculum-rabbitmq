# RabbitMQ for the integration tests. Mounted at /etc/rabbitmq/rabbitmq.conf;
# the image's own defaults in /etc/rabbitmq/conf.d/ still load alongside it.

# The vhost and user. Imported after the management API starts listening and
# before the AMQP listener does; the compose healthcheck waits for the vhost.
load_definitions = /etc/rabbitmq/definitions.json

# The tests find the client's connection, and the channels on it, in the
# management API's listings, which come from the management plugin's metrics
# collection. RabbitMQ has deprecated that and says a future minor version will
# not permit it by default; the image tag follows minor versions. Permitting it
# keeps such an upgrade from emptying every listing. A major version that
# removes the feature stops this line working, and both tests fail at their
# first listing. https://github.com/tsarna/vinculum/issues/273 is the
# non-deprecated way to do the same, after which this becomes `false`.
deprecated_features.permit.management_metrics_collection = true
